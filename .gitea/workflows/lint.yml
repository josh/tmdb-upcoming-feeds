name: Lint

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go-version:
    runs-on: ubuntu-slim-amd64
    steps:
      - uses: josh/check-nixpkgs-go@8eddf920954415accedbba0f0cdebc90a3ce307a # v1.0.0

  go:
    runs-on: ubuntu-slim-amd64

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: gofmt
        run: test -z "$(gofmt -l . | tee /dev/stderr)"

      - name: go vet
        run: go vet ./...
